- name: Deploy to Tomcat
  hosts: web
  become: yes
  tasks: 
    - name: Copy WAR file to Tomcat
      copy:
        src: "/var/snap/jenkins/5022/workspace/My Ansible Web App/target/MavenAnsibleWebApp.war"
        dest: "/opt/tomcat/webapps/MavenAnsibleWebApp.war"
        remote_src: no

    - name: Shutdown Tomcat
      shell: /opt/tomcat/bin/shudown.sh
      ignore_errors: yes

    - name: Start Tomcat
      shell: /opt/tomcat/bin/startup.sh
    
